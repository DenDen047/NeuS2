services:
  neus2:
    container_name: neus2
    deploy:
      resources:
        reservations:
          memory: 8G
          devices:
            - driver: nvidia
              capabilities: [gpu]
              device_ids: ['0']
    image: denden047/neus2
    build:
      args:
        - BASE_IMAGE=nvidia/cuda:12.1.0-devel-ubuntu22.04
        - PYTHON_VERSION=3.10
        - FORCE_CUDA=1
        - UID=1002
        - GID=1002
        - USER_NAME=naoya
        - GROUP_NAME=naoya
        - TORCH_CUDA_ARCH_LIST=7.5
      context: ./
      dockerfile: Dockerfile
    tty: true
    volumes:
      - ../:/home/naoya/project
      - /data/naoya/NeuS2:/data
    # ports:
    #   - 8000:8000
